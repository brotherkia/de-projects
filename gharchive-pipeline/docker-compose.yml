# Airflow 3.3.1, LocalExecutor, for running the GH Archive pipeline locally.
#
# Trimmed down from Apache's official compose file, which uses CeleryExecutor
# and therefore also needs Redis, a worker and a triggerer. LocalExecutor runs
# tasks inside the scheduler process instead: fewer moving parts, less RAM,
# and for one hourly DAG on a laptop there is nothing to gain from a
# distributed queue.
#
# Two separate Postgres instances on purpose:
#   airflow-db    Airflow's own metadata (DAG runs, task state, XCom)
#   analytics-db  the tables THIS pipeline produces
# Keeping them apart is the habit that matters -- your analytics tables should
# never be one bad migration away from Airflow's internals, and in a real
# deployment they'd be different servers entirely.
#
# Start:  docker compose up -d
# UI:     http://localhost:8080   (admin / admin)
# Query:  docker compose exec analytics-db psql -U analytics -d analytics
#
# Ports are overridable, because "8080 is free" is a fact about one machine and
# not about the next one. If either is taken, copy .env.example to .env and
# change it there -- compose reads .env automatically, and .env is gitignored
# so your local choice never becomes everyone's default:
#   AIRFLOW_PORT=8081
#   ANALYTICS_DB_PORT=5433

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Secrets come from .env (gitignored) so they are never committed.
    # ./setup.sh generates it; see .env.example to do it by hand.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set it in .env -- see .env.example}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?set it in .env -- see .env.example}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Where the pipeline's own analytics tables go -- NOT airflow-db above.
    PIPELINE_DB_HOST: analytics-db
    PIPELINE_DB_NAME: analytics
    PIPELINE_DB_USER: analytics
    PIPELINE_DB_PASSWORD: analytics
    GH_DATA_DIR: /opt/airflow/gh_data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - airflow-logs:/opt/airflow/logs
    - gh-data:/opt/airflow/gh_data
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    analytics-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-db:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      # Exposed so you can point DBeaver/psql at it from the host.
      - "${ANALYTICS_DB_PORT:-5432}:5432"
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    # Runs as root purely to fix ownership of the gh-data volume: Docker
    # creates a named volume's mount point owned by root, but every Airflow
    # process runs as uid 50000 and needs to write downloads there.
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/gh_data/raw /opt/airflow/gh_data/staging
        chown -R 50000:0 /opt/airflow/gh_data
        su airflow -c "airflow db migrate"
        su airflow -c "airflow users create \
          --username admin --password admin \
          --firstname Parsa --lastname Kiaee \
          --role Admin --email admin@example.com" || true
        echo 'init complete'

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # Host port only. Inside the compose network this is always 8080.
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3 parses DAG files in a separate process from the scheduler, so a
  # DAG that hangs on import can't stall scheduling for everything else.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Single-broker Kafka in KRaft mode -- no Zookeeper. One broker is the right
  # size here: the point of this service is to prove that a streaming path
  # produces the SAME aggregates as the batch tables, and a second broker adds
  # replication mechanics without adding anything to that proof.
  #
  # Two listeners, which is the part worth understanding:
  #   PLAINTEXT      kafka:9092        for clients inside the compose network
  #   PLAINTEXT_HOST localhost:29092   for scripts run from the host venv
  # A broker advertises the address clients should call back on. Advertise only
  # the internal name and host clients connect once, then get handed "kafka:9092"
  # and hang; advertise only localhost and in-network clients break the same way.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # All three default to 3 and would leave every internal topic stuck
      # under-replicated on a one-broker cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Don't make a solo consumer wait out the default 3s rebalance window.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: gharchive-local-cluster
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Kafka's missing web UI. The broker ships no interface of its own -- the
  # CLI in the kafka container is the only other way to see a topic -- so this
  # is here to make partitions, offsets, consumer lag and message payloads
  # visible while reasoning about the streaming path.
  #
  # Read-only by design: DYNAMIC_CONFIG_ENABLED is left off, so the UI cannot
  # create or delete topics. Inspecting a pipeline should not be able to
  # reshape it by accident.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: gharchive-local
      # kafka:9092 is the in-network listener; localhost:29092 is the host one
      # and would resolve to this container, not the broker.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: DISABLED
    ports:
      - "${KAFKA_UI_PORT:-8082}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # A window onto analytics-db. The pipeline writes 9.7M events and there was
  # no way to look at them without psql, which is fine for one query and
  # useless for exploring.
  #
  # The server connection is pre-registered from pgadmin/servers.json, so the
  # analytics database is already in the tree on first login -- no host, port
  # or password to type. Note Host there is "analytics-db", the compose service
  # name: pgAdmin runs INSIDE the network, so localhost:5433 (which is how you
  # reach it from your laptop) would point at the pgAdmin container itself.
  # That mix-up is the usual reason a containerised DB client "can't connect".
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Local-only tool; skip the master-password prompt on every login.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-8083}:80"
    depends_on:
      analytics-db:
        condition: service_healthy

volumes:
  airflow-db-data:
  analytics-db-data:
  airflow-logs:
  gh-data:
  kafka-data:
  pgadmin-data:
